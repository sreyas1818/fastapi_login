<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #c62828, #e53935);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            color: #b71c1c;
            margin-bottom: 8px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #e53935;
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn {
            background-color: #e53935;
            color: white;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            background-color: #b71c1c;
        }

        .register-btn {
            background-color: #ffffff;
            color: #b71c1c;
            border: 2px solid #b71c1c;
        }

        .register-btn:hover {
            background-color: #b71c1c;
            color: white;
        }

        .links {
            margin-top: 25px;
            font-size: 14px;
        }

        .links a {
            color: #b71c1c;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error {
            background-color: #fdecea;
            color: #b71c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>User Login</h2>
    <p>Login or register as a blood donor</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <!-- LOGIN FORM -->
    <form method="post" action="/user/login">

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn login-btn">Login</button>
    </form>

    <!-- REGISTER BUTTON -->
<form action="/user/register" method="get">
    <button type="submit" class="btn register-btn">
        Register as New User
    </button>
</form>


    <div class="links">
        <a href="/login">← Back to Home</a>
    </div>

</div>

</body>
</html>
