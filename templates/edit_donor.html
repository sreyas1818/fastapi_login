<!DOCTYPE html>
<html>
<head>
    <title>Edit Donor</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0d47a1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1976d2;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0d47a1;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #1976d2;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Edit Donor Details</h2>

    <form method="post" action="/update/{{ donor.id }}">

        <label>Name</label>
        <input type="text" name="name" value="{{ donor.name }}" required>

        <label>Phone</label>
        <input type="text" name="phone" value="{{ donor.phone }}" required>

        <label>City</label>
        <input type="text" name="city" value="{{ donor.city }}" required>

        <button type="submit">Update</button>
    </form>

    <a href="/admin/dashboard" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
